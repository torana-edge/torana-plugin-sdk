name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: '35.1'
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
      - run: ./scripts/generate-go.sh && git diff --exit-code
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
      - run: buf lint
      - name: GitHub Actions use immutable commits
        run: ./scripts/check-actions-pinned.sh
      - if: github.event_name == 'pull_request'
        name: ABI compatibility
        run: ./scripts/check-abi-breaking.sh
      - run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run --timeout 5m
      - run: GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -buildvcs=false -o /tmp/go-logger.wasm ./examples/go-logger
      # The release workflow asserts the Rust crate version matches the tag, but
      # it only runs once the tag exists — and a module proxy caches a tag's
      # content immutably, so by then it is too late to correct cheaply. Both
      # This catches version drift while it is still a commit. See RELEASING.md.
      - name: Crate version is not behind the latest tag
        run: |
          crate=$(grep -m1 '^version = ' rust/torana-plugin-sdk/Cargo.toml | cut -d'"' -f2)
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
          echo "crate=$crate latest_tag=${latest:-none}"
          [ -z "$latest" ] && exit 0
          # Sorting both and taking the top tells us which is newer without
          # needing semver arithmetic in shell.
          if [ "$crate" != "$latest" ] && [ "$(printf '%s\n%s\n' "$crate" "$latest" | sort -V | tail -1)" = "$latest" ]; then
            echo "::error::rust/torana-plugin-sdk/Cargo.toml is $crate but v$latest is already tagged." \
                 "Bump the crate before tagging — see RELEASING.md." >&2
            exit 1
          fi
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-wasip1
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Crate protobuf matches canonical ABI
        run: |
          # The crate needs its own copy because a crates.io package cannot read
          # files outside its archive, so both copies are checked. Comparing
          # descriptor sets rather than text means comments may differ while any
          # field, type or number change fails.
          test -f proto/torana/v1/torana.proto || {
            echo "::error::canonical ABI proto is missing or moved: proto/torana/v1/torana.proto" >&2
            exit 1
          }
          test -f rust/torana-plugin-sdk/proto/torana/v1/torana.proto || {
            echo "::error::Rust crate is missing the ABI proto" >&2
            exit 1
          }
          protoc -I proto --descriptor_set_out=/tmp/canonical-v1.pb proto/torana/v1/torana.proto
          protoc -I rust/torana-plugin-sdk/proto --descriptor_set_out=/tmp/crate-v1.pb rust/torana-plugin-sdk/proto/torana/v1/torana.proto
          cmp /tmp/canonical-v1.pb /tmp/crate-v1.pb
      - run: cargo fmt --manifest-path rust/torana-plugin-sdk/Cargo.toml --check
      - run: cargo clippy --manifest-path rust/torana-plugin-sdk/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/torana-plugin-sdk/Cargo.toml
      - run: cargo package --manifest-path rust/torana-plugin-sdk/Cargo.toml --locked
      - run: cargo build --target wasm32-wasip1 --target-dir /tmp/rust-logger-target --manifest-path examples/rust-logger/Cargo.toml
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: rust/torana-plugin-sdk
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
      # The conformance guests export EVERY hook. The examples export only
      # before-request, so an unregistered hook returns 0 before it decodes
      # anything — which makes them useless for testing decode behaviour, since
      # "ignored the codec error" and "no handler" look identical from outside.
      #
      # Exercise both language SDKs against the same ABI-v1 host harness.
      - run: GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -buildvcs=false -o /tmp/go-allhooks.wasm ./conformance/guests/go-allhooks
      - run: cargo build --target wasm32-wasip1 --target-dir /tmp/rust-allhooks-target --manifest-path conformance/guests/rust-allhooks/Cargo.toml
      - run: go test ./conformance/host
        env:
          TORANA_GO_GUEST: /tmp/go-allhooks.wasm
          TORANA_GO_GUEST_MANIFEST: conformance/guests/go-allhooks/plugin.json
          TORANA_RUST_GUEST: /tmp/rust-allhooks-target/wasm32-wasip1/debug/torana-rust-allhooks.wasm
          TORANA_RUST_GUEST_MANIFEST: conformance/guests/rust-allhooks/plugin.json
      # The example plugins are what release.yml actually publishes. Pointing
      # the conformance vars at the all-hooks guests above would leave the
      # shipped artifacts with only a compile check, so run the ABI and
      # manifest checks against both examples too. The Rust row additionally
      # proves its dispatcher reaches env.log with the expected bytes.
      - run: GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -buildvcs=false -o /tmp/go-logger.wasm ./examples/go-logger
      # Both the run_hook exercise and the bitmap/manifest comparison: the
      # shipped example is what release.yml publishes, so its exported hook set
      # must match its manifest exactly, not merely be non-zero.
      - run: go test ./conformance/host -run 'TestCompiledGoGuestImplementsRunHook|TestGuestBitmapMatchesManifest' -count=1
        env:
          TORANA_GO_GUEST: /tmp/go-logger.wasm
          TORANA_GO_GUEST_MANIFEST: examples/go-logger/plugin.json
      - run: go test ./conformance/host -run 'TestCompiledRustGuestImplementsRunHook|TestRustGuestBitmapMatchesManifest|TestCompiledRustLoggerCallsHost' -count=1
        env:
          TORANA_RUST_GUEST: /tmp/rust-logger-target/wasm32-wasip1/debug/torana-rust-logger.wasm
          TORANA_RUST_GUEST_MANIFEST: examples/rust-logger/plugin.json
          TORANA_RUST_LOGGER: /tmp/rust-logger-target/wasm32-wasip1/debug/torana-rust-logger.wasm
