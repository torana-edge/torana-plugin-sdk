name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: arduino/setup-protoc@v3
        with:
          version: '35.1'
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
      - run: ./scripts/generate-go.sh && git diff --exit-code
      - uses: bufbuild/buf-setup-action@v1
      - run: buf lint
      - if: github.event_name == 'pull_request'
        run: |
          if git cat-file -e origin/main:proto/torana/v1/torana.proto 2>/dev/null; then
            buf breaking --against 'https://github.com/torana-edge/torana-plugin-sdk.git#branch=main'
          else
            echo "No ABI baseline exists on main yet; this PR establishes v1."
          fi
      - run: go test ./...
      - run: GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -buildvcs=false -o /tmp/go-logger.wasm ./examples/go-logger
      # The release workflow asserts the Rust crate version matches the tag, but
      # it only runs once the tag exists — and a module proxy caches a tag's
      # content immutably, so by then it is too late to correct cheaply. Both
      # v0.1.1 and v0.1.2 shipped with the crate still advertising 0.1.0 and
      # produced no release artifacts at all.
      #
      # This catches the same drift while it is still a commit. See RELEASING.md.
      - name: Crate version is not behind the latest tag
        run: |
          crate=$(grep -m1 '^version = ' rust/torana-plugin-sdk/Cargo.toml | cut -d'"' -f2)
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
          echo "crate=$crate latest_tag=${latest:-none}"
          [ -z "$latest" ] && exit 0
          # Sorting both and taking the top tells us which is newer without
          # needing semver arithmetic in shell.
          if [ "$crate" != "$latest" ] && [ "$(printf '%s\n%s\n' "$crate" "$latest" | sort -V | tail -1)" = "$latest" ]; then
            echo "::error::rust/torana-plugin-sdk/Cargo.toml is $crate but v$latest is already tagged." \
                 "Bump the crate before tagging — see RELEASING.md." >&2
            exit 1
          fi
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Crate protobuf matches canonical ABI
        run: |
          protoc -I proto --descriptor_set_out=/tmp/canonical.pb proto/torana/v1/torana.proto
          protoc -I rust/torana-plugin-sdk/proto --descriptor_set_out=/tmp/crate.pb rust/torana-plugin-sdk/proto/torana/v1/torana.proto
          cmp /tmp/canonical.pb /tmp/crate.pb
      - run: cargo fmt --manifest-path rust/torana-plugin-sdk/Cargo.toml --check
      - run: cargo clippy --manifest-path rust/torana-plugin-sdk/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/torana-plugin-sdk/Cargo.toml
      - run: cargo package --manifest-path rust/torana-plugin-sdk/Cargo.toml --locked
      - run: cargo build --target wasm32-wasip1 --target-dir /tmp/rust-logger-target --manifest-path examples/rust-logger/Cargo.toml
      - uses: rustsec/audit-check@v2
        with:
          working-directory: rust/torana-plugin-sdk
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      # The conformance guests export EVERY hook. The examples export only
      # run_before_request, so an unregistered hook returns 0 before it decodes
      # anything — which makes them useless for testing decode behaviour, since
      # "ignored the codec error" and "no handler" look identical from outside.
      - run: GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -buildvcs=false -o /tmp/go-allhooks.wasm ./conformance/guests/go-allhooks
      - run: cargo build --target wasm32-wasip1 --target-dir /tmp/rust-allhooks-target --manifest-path conformance/guests/rust-allhooks/Cargo.toml
      - run: go test ./conformance/host
        env:
          TORANA_GO_GUEST: /tmp/go-allhooks.wasm
          TORANA_RUST_GUEST: /tmp/rust-allhooks-target/wasm32-wasip1/debug/torana-rust-allhooks.wasm
      # The example plugins are what release.yml actually publishes. Pointing
      # the conformance vars at the all-hooks guests above would leave the
      # shipped artifacts with only a compile check, so run the before-request
      # ABI test against them too — that is the hook they export.
      - run: GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -buildvcs=false -o /tmp/go-logger.wasm ./examples/go-logger
      - run: go test ./conformance/host -run TestCompiledGuestsImplementBeforeRequestABI -count=1
        env:
          TORANA_GO_GUEST: /tmp/go-logger.wasm
          TORANA_RUST_GUEST: /tmp/rust-logger-target/wasm32-wasip1/debug/torana-rust-logger.wasm
