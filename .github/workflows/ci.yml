name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - run: go test ./...
      - run: GOOS=wasip1 GOARCH=wasm go build -buildvcs=false -o /tmp/go-logger.wasm ./examples/go-logger
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo test --manifest-path rust/torana-plugin-sdk/Cargo.toml
      - run: cargo build --target wasm32-wasip1 --manifest-path examples/rust-logger/Cargo.toml
