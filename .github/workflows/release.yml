name: Release SDK

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: go test ./...
      - run: cargo test --manifest-path rust/torana-plugin-sdk/Cargo.toml
      - name: Verify tag matches crate version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"${version}\"$" rust/torana-plugin-sdk/Cargo.toml
      - run: cargo package --manifest-path rust/torana-plugin-sdk/Cargo.toml --locked
      - name: Publish Rust crate
        run: cargo publish --manifest-path rust/torana-plugin-sdk/Cargo.toml --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: |
          mkdir -p dist
          GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -buildvcs=false -o dist/go-logger.wasm ./examples/go-logger
          cargo build --release --target wasm32-wasip1 --target-dir /tmp/rust-logger-target --manifest-path examples/rust-logger/Cargo.toml
          cp /tmp/rust-logger-target/wasm32-wasip1/release/torana-rust-logger.wasm dist/rust-logger.wasm
          (cd dist && sha256sum *.wasm > checksums.txt)
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
      - uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: dist/checksums.txt
