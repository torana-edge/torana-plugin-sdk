name: Release SDK

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: GitHub Actions use immutable commits
        run: ./scripts/check-actions-pinned.sh
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-wasip1
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: go test ./...
      - run: cargo test --manifest-path rust/torana-plugin-sdk/Cargo.toml
      - name: Verify tag matches crate version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"${version}\"$" rust/torana-plugin-sdk/Cargo.toml
      - run: cargo package --manifest-path rust/torana-plugin-sdk/Cargo.toml --locked
      - name: Publish Rust crate
        run: cargo publish --manifest-path rust/torana-plugin-sdk/Cargo.toml --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: |
          mkdir -p dist
          GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -buildvcs=false -o dist/go-logger.wasm ./examples/go-logger
          cargo build --release --target wasm32-wasip1 --target-dir /tmp/rust-logger-target --manifest-path examples/rust-logger/Cargo.toml
          cp /tmp/rust-logger-target/wasm32-wasip1/release/torana-rust-logger.wasm dist/rust-logger.wasm
          (cd dist && sha256sum *.wasm > checksums.txt)
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: dist/*
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-checksums: dist/checksums.txt
