[package]
name = "torana-plugin-sdk"
# Must equal the git tag this is released under, without the leading "v".
# The release workflow asserts it, and a mismatch fails after the tag exists —
# which is expensive, because module proxies cache a tag's content immutably and
# it cannot then be moved. See RELEASING.md.
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Versioned Rust SDK for Torana WASI plugins"
repository = "https://github.com/torana-edge/torana-plugin-sdk"
build = "build.rs"

[dependencies]
prost = "0.13"
serde_json = "1"

[build-dependencies]
prost-build = "0.13"
