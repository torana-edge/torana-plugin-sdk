syntax = "proto3";

package torana.v1;
option go_package = "github.com/torana-edge/torana-plugin-sdk/pb/v1";

// The Torana plugin ABI, version 1.
//
//   - Guests export a single run_hook(ptr, size) -> u64. Hook identity lives
//     only in the HookInput payload oneof; request_id lives only on HookInput.
//   - Guests ALSO export supported_hooks() -> u32, a bitmap of hooks the module
//     actually implements. That is startup introspection, not a second dispatch
//     discriminator: run_hook still routes only from the payload. The bitmap
//     must exactly equal the manifest hook set (missing and unexpected bits,
//     bit 0, unassigned bits, and an empty/zero set are load-time errors).
//     Without it, collapsing five exports to one would erase the only
//     artifact-level proof that a declared hook has a handler.
//   - Hook payloads are enveloped and self-describing.
//   - Results carry an explicit disposition; a zero-byte protobuf is never an
//     implicit action.
//   - Host calls return a typed result whose error arm cannot be confused with
//     plugin-owned data.
//   - The response hook receives a dedicated ChatResponse.
//   - Whether a response dispatch is mutable lives on the after-response
//     wrapper, not the global envelope — only that path can be observational.
//
// Tool-call arguments and tool parameters remain `bytes` holding verbatim JSON.
// That is load-bearing, not laziness: decoding and re-encoding them reorders
// object keys, which changes the cacheable prompt prefix and silently costs the
// operator a cache hit on every request a plugin touches.

// ---------------------------------------------------------------------------
// Chat IR
// ---------------------------------------------------------------------------

// A single turn in a chat conversation.
//
// The message BODY is the ordered block sequence: one authority, in provider
// wire order, for every content fact (text, thinking, tool use, tool result,
// cache breakpoints, unknown provider arms, signatures). There are no
// competing flat content fields. An explicit empty provider message is one
// RequestTextBlock with text == ""; an empty blocks list is not a second
// spelling (a request Message always carries at least one block).
message Message {
  string role = 1;
  // The sole body authority. Order is provider wire order and is preserved
  // exactly; the adapter never reorders blocks.
  repeated RequestBlock blocks = 2;
}

// One ordered element of a request message body.
message RequestBlock {
  oneof kind {
    RequestTextBlock text = 1;
    RequestThinkingBlock thinking = 2;
    RequestRedactedThinkingBlock redacted_thinking = 3;
    RequestToolUseBlock tool_use = 4;
    RequestToolResultBlock tool_result = 5;
    RequestCacheBreakpoint cache_breakpoint = 6;
    RequestUnknownBlock unknown = 7;
    RequestTrailingSignatureBlock trailing_signature = 8;
  }
}

// Plain text. Explicit empty text is a first-class arm (provider-visible
// position must survive).
message RequestTextBlock {
  string text = 1;
  // Opaque provider token bound to THIS text block (Gemini/Code Assist
  // thoughtSignature beside non-thought text). Provenance-governed: the host
  // verifier rejects a retained token over changed text (stale), requires a
  // cleared token over changed text, and rejects added/changed/reused tokens.
  string signature = 2;
  // Provider Part-level custom metadata (Gemini partMetadata), absent or a
  // strict JSON object. Governed by the containing role's write grant and
  // covered by this block's signature binding.
  bytes part_metadata_json = 3;
}

// Extended thinking / reasoning text.
message RequestThinkingBlock {
  string text = 1;
  // Opaque provider token bound to this thinking block (current-block
  // signature). Provenance-governed exactly like RequestTextBlock.signature.
  string signature = 2;
  // Provider Part-level custom metadata (Gemini partMetadata), absent or a
  // strict JSON object; covered by this block's signature binding.
  bytes part_metadata_json = 3;
}

// A redacted reasoning block: the provider replaced the reasoning payload
// with a placeholder; only the placeholder bytes survive.
message RequestRedactedThinkingBlock {
  string data = 1;
}

// An assistant's request to invoke a tool.
//
// Request-side tool calls are blocks at their exact wire position. Identity
// (id/name) and arguments are writable under the containing message-role
// grant; the provider signature token is provenance-governed.
message RequestToolUseBlock {
  // Required, non-empty, valid UTF-8.
  string id = 1;
  // Required, non-empty, valid UTF-8.
  string name = 2;
  // Required non-empty JSON object, verbatim (key order is part of the
  // cacheable prefix). "{}" is the canonical empty arguments shape.
  bytes arguments_json = 3;
  // Opaque provider token bound to this call (e.g. Gemini thoughtSignature).
  string signature = 4;
  // Provider Part-level custom metadata (Gemini partMetadata), absent or a
  // strict JSON object; covered by this block's signature binding.
  bytes part_metadata_json = 5;
}

// A tool result at its exact wire position inside a (usually user-role)
// message. Provider message boundaries stay intact: one provider message
// with [text, tool_result, text] stays ONE Message with three blocks.
message RequestToolResultBlock {
  // Required, non-empty, valid UTF-8. Identifies the answered call; the
  // host correlates it against the call the provider actually issued.
  string tool_call_id = 1;
  // Provider-neutral tool name when the wire carries one (empty otherwise).
  string tool_name = 2;
  // Ordered NESTED content of this result. Dedicated block types: nested
  // tool uses/results/thinking/signatures are impossible at the type level.
  // A present provider result is either a non-empty list or one explicit
  // empty ToolResultTextBlock — never an empty list masquerading as "absent".
  repeated ToolResultContentBlock content = 3;
  // Provider Part-level custom metadata (Gemini partMetadata), absent or a
  // strict JSON object; covered by this block's signature binding.
  bytes part_metadata_json = 4;
  // Gemini functionResponse willContinue: presence is meaningful (an
  // explicitly supplied false differs from absent). Only applicable to
  // NON_BLOCKING function calls.
  optional bool will_continue = 5;
  // Gemini functionResponse scheduling: the exact wire enum string
  // (SILENT / WHEN_IDLE / INTERRUPT) or absent (provider default WHEN_IDLE).
  // Presence is meaningful; the vocabulary is the provider adapter's
  // boundary rule (unknown values are the value-free 400).
  optional string scheduling = 6;
  // Opaque provider token bound to this result (Gemini thoughtSignature on
  // a functionResponse part): the complete signed Part — identity, provider
  // metadata, willContinue/scheduling, and the ordered nested content.
  // Provenance-governed exactly like the other request tokens.
  string signature = 7;
}

// A provider cache breakpoint at an explicit position in the ordered body:
// the breakpoint CLOSES the cached prefix at its position (after the content
// it covers). Multiple markers per message are naturally representable;
// there is no separate message-level summary field.
message RequestCacheBreakpoint {
  // Required JSON object, verbatim (e.g. Anthropic {"type":"ephemeral"}).
  bytes marker_json = 1;
}

// A provider content arm Torana does not model, preserved at its exact wire
// position.
message RequestUnknownBlock {
  // Required, non-empty provider wire kind/type name.
  string kind = 1;
  // Required validated JSON object. The SDK proves kind + strict object;
  // the kind-specific projection invariant — the payload must NOT carry the
  // canonical discriminant or a canonical cache member (the block kinds are
  // the single authority for those facts) — is the PROVIDER ADAPTER's
  // marshal validator, which must reject a returned payload duplicating
  // them before marshal (an executable edge obligation, not an SDK rule: the
  // SDK has no provider vocabulary).
  bytes payload_json = 2;
  // Provider Part-level custom metadata (Gemini partMetadata), absent or a
  // strict JSON object; covered by this block's signature binding.
  bytes part_metadata_json = 3;
  // Opaque provider token bound to this media/future arm (Gemini
  // thoughtSignature on inlineData/fileData/toolCall/toolResponse and other
  // unmodelled parts). Binds the reconstruction kind AND the payload AND
  // the provider metadata. Provenance-governed exactly like the other
  // request tokens.
  string signature = 4;
}

// Code Assist's trailing signature-only empty-text part: the standalone
// provider token binding the preceding CLOSED text/thinking content of this
// message (never tool-call blocks). Assistant-only, singular, and FINAL.
message RequestTrailingSignatureBlock {
  // Required, non-empty.
  string signature = 1;
  // Provider Part-level custom metadata (Gemini partMetadata) on the
  // trailing standalone Part, absent or a strict JSON object. Covered by
  // this token's binding (SameMessage metadata + the preceding
  // TrailingStandalone text/thinking content).
  bytes part_metadata_json = 2;
}

// One ordered element of a tool result's nested content. Dedicated oneof:
// nested tool use/result/thinking/signature blocks are unrepresentable.
message ToolResultContentBlock {
  oneof kind {
    ToolResultTextBlock text = 1;
    ToolResultUnknownBlock unknown = 2;
    ToolResultCacheBreakpoint cache_breakpoint = 3;
  }
}

message ToolResultTextBlock {
  string text = 1;
}

message ToolResultUnknownBlock {
  // Required, non-empty provider wire kind/type name.
  string kind = 1;
  // Required validated JSON object; canonical members removed.
  bytes payload_json = 2;
}

message ToolResultCacheBreakpoint {
  // Required JSON object, verbatim.
  bytes marker_json = 1;
}

// A tool call on the RESPONSE path (ResponseMessage) or the stream
// (ToolCallRef). Request-side tool calls use RequestToolUseBlock; this type
// deliberately has no request-domain role.
message ToolCall {
  string id = 1;
  string name = 2;
  // Verbatim JSON. Never decode and re-encode: key order is part of the
  // cacheable prefix.
  bytes arguments_json = 3;
  // Opaque provider token bound to this call (e.g. Gemini thoughtSignature).
  // Preserved across round-trips so replayed history keeps the model's
  // reasoning binding; empty for providers that don't emit one.
  string signature = 4;
}

// Describes a function available to the model.
message ToolDef {
  string name = 1;
  string description = 2;
  // Verbatim JSON Schema. Same rule as arguments_json.
  bytes parameters_json = 3;
  bool strict = 4;
  // Opaque cache breakpoint after this tool definition (JSON object).
  bytes cache_control_json = 5;
}

// Token accounting reported by the provider.
message Usage {
  int32 input_tokens = 1;
  int32 output_tokens = 2;
  // Input tokens served from the provider's prompt cache.
  int32 cache_read_tokens = 3;
  // Input tokens written to the cache this turn; 0 if unreported.
  int32 cache_write_tokens = 4;
}

// Canonical representation of a chat completion request.
message ChatRequest {
  string model = 1;
  repeated Message messages = 2;
  repeated ToolDef tools = 3;
  bool stream = 4;

  optional int32 max_tokens = 5;
  optional double temperature = 6;
  optional double top_p = 7;
  repeated string stop_sequences = 8;

  // Unparsed provider fields, passed through transparently as JSON.
  bytes provider_extensions_json = 9;
  bytes safety_settings_json = 10;

  // Proxy-internal metadata the host publishes to plugins: the routed provider,
  // the conversation id, the request path. Never serialized to the wire.
  // Verdicts are host calls in the ABI, so this is host-owned: a plugin changing it
  // is a protocol violation, not a grantable edit.
  bytes torana_meta_json = 11;
}

// The assistant's reply on the non-streaming response path.
//
// Deliberately narrower than Message. The request-only ordered-body fields
// (blocks and every block kind, cache breakpoints, tool-result identity) are
// omitted so the authoring API cannot autocomplete silent no-ops. When the
// host later observes and can write those back, add them as additive fields
// with deliberate policies — do not reuse Message here.
message ResponseMessage {
  // Present only when the host has a writable text slot on the provider body.
  // Absence means "no text part exists", which is distinct from the empty
  // string. Presence itself is host-owned (fixed across accepted→output);
  // the string value is governed by ir.messages.write.assistant when present
  // on both sides.
  optional string content = 1;
  // Fixed cardinality and positional order: output element N mutates accepted
  // element N. Nested ToolCall.id is host-owned; name and arguments_json are
  // assistant-writable in place. For calls with no stable provider ID,
  // positional identity is all the wire can prove — a semantic swap of two
  // wholly writable anonymous calls is indistinguishable from rewriting both.
  repeated ToolCall tool_calls = 2;
}

// Canonical representation of a completed, non-streamed response.
message ChatResponse {
  // Model that actually answered, which may differ from the one requested.
  // Host-owned: observed fact — request ir.model.write does not authorise
  // forging it.
  string model = 1;
  // Provider's response id, empty when it reported none.
  // Host-owned: forging it breaks correlation.
  string id = 2;
  // The assistant's turn. See ResponseMessage for the writable surface.
  ResponseMessage message = 3;
  // Host-owned: observed provider stop reason. Not ir.messages.write.assistant —
  // the first-cut host applies content and in-place tool name/arguments only.
  string finish_reason = 4;
  // Host-owned: forging usage forges the bill / observability.
  Usage usage = 5;
  // Upstream HTTP status. Non-2xx responses reach observational hooks too.
  // Host-owned: host-measured fact.
  int32 upstream_status = 6;
  // Host-owned: host-measured latency.
  int64 duration_ms = 7;
  // Provider fields Torana did not model, verbatim.
  // Host-owned: opaque provider output — not request ir.params.write.
  bytes provider_extensions_json = 8;
  // Host-owned configured provider name that produced (or attempted) this
  // response. This is Torana routing identity, not a provider wire field.
  string provider = 9;
  // Host-owned completion wall-clock time in Unix milliseconds. Observability
  // plugins can timestamp records without requesting ambient clock authority.
  int64 completed_at_unix_ms = 10;
}

// ---------------------------------------------------------------------------
// Streaming
// ---------------------------------------------------------------------------

// Identifies the tool call a "tool_call" content block is assembling. Its
// arguments arrive as ToolCallDelta events between the block's start and stop.
message ToolCallRef {
  string id = 1;
  string name = 2;
  // Opaque provider token on the call (Gemini thoughtSignature); empty otherwise.
  string signature = 3;
}

message ToolCallDelta {
  // Must name the OPEN tool-call block this delta belongs to: tool deltas
  // bind their tool block BY INDEX, and multiple tool blocks may be open
  // concurrently. See StreamEvent index invariants.
  int32 index = 1;
  string arguments_delta = 2;
}

message StreamError {
  // Terminal abort of the streamed message. See StreamEvent stream-state rules:
  // may arrive while content blocks are open; abandons ALL open blocks (tool
  // and non-tool) without ContentBlockStops; ends the stream (no MessageStop
  // required); no further events. Incomplete tool-call argument buffers must be
  // discarded, not assembled into an executable call.
  int32 code = 1;
  string message = 2;
}

// Structural boundaries in a streamed response.
message MessageStart {
  // "assistant" for every provider Torana currently speaks, but carried rather
  // than assumed.
  string role = 1;
  string id = 2;
  string model = 3;
}

// MessageStop closes the message and carries why it ended. finish_reason lives
// here rather than in a second event so each fact has one representation.
message MessageStop {
  string finish_reason = 1;
}

// A block carrying assistant text. Empty today; a message rather than a bare
// enum so it can gain fields without changing the oneof.
message TextBlock {}

// A block carrying extended thinking / reasoning text.
message ThinkingBlock {}

// A block a provider emits that Torana does not model. The kind is passed
// through verbatim so a plugin written for that provider can still act on it.
message ProviderBlock {
  string kind = 1;
}

// ContentBlockStart opens a block. Deltas that follow belong to it until the
// matching stop.
//
// This is the only block-opening boundary. Every block kind uses the same
// start/delta/stop topology so assemblers do not infer structure from deltas.
//
// The kind is a oneof rather than a string with optional metadata beside it.
// A string would allow "tool_call" with no tool metadata, and "text" carrying
// some — contradictions a reader would have to know were impossible. A oneof
// makes them unrepresentable.
//
// Stream-state rule: non-tool content (text, thinking, provider) is exclusive —
// at most ONE non-tool block may be open at a time, and no tool block may be
// open concurrently with it. Tool-call blocks are the exception: MULTIPLE tool
// blocks may be open at once, each at its own unique never-reused index
// (OpenAI Chat legitimately streams several tool calls concurrently). A
// non-tool start requires no block open; a tool start requires no non-tool
// block open but may coexist with other open tool blocks. TextDelta /
// ThinkingDelta / signature_delta under CurrentContentBlock belong to the
// single open non-tool block (and are invalid when no compatible block is
// open).
message ContentBlockStart {
  // Unique across the entire streamed message; never reused after the block
  // closes. Deltas and ContentBlockStop must use this same index. A
  // ContentBlockStop / ToolCallDelta whose index does not name an open start
  // of the matching kind is invalid. Adapters MUST assign distinct indexes to
  // concurrent parallel tool-call parts (emitting Index:0 for every Gemini
  // functionCall is not conformant). SignatureScopeToolCallBlockByIndex
  // depends on this.
  int32 index = 1;
  oneof block {
    TextBlock text = 2;
    ThinkingBlock thinking = 3;
    ToolCallRef tool_call = 4;
    ProviderBlock provider = 5;
  }
}

message ContentBlockStop {
  // Must name an OPEN block of the matching kind: tool stops bind their open
  // tool block by index (multiple tool blocks may be open concurrently); a
  // non-tool stop names the single open non-tool block.
  int32 index = 1;
}

// StreamEvent is one event in a streamed response.
//
// The canonical sequence, which adapters produce and plugins may rely on:
//
//   MessageStart{role, id, model}
//     ContentBlockStart{index: 0, tool_call{id, name}}
//       ToolCallDelta{index: 0, arguments_delta} ...
//     ContentBlockStart{index: 1, tool_call{id, name}}   // 2nd tool opens
//       ToolCallDelta{index: 1, arguments_delta} ...     //   before 0 closes;
//       ToolCallDelta{index: 0, arguments_delta} ...     //   deltas interleave
//     ContentBlockStop{index: 0}                        //   by index
//     ContentBlockStop{index: 1}
//     ContentBlockStart{index: 2, text{} | thinking{}}
//       TextDelta / ThinkingDelta ...
//     ContentBlockStop{index: 2}
//   Usage
//   MessageStop{finish_reason}
//
// Usage may arrive before or after MessageStop depending on the provider.
// StreamError is a terminal abort (see invariants below) and may replace the
// remainder at any point, including mid-block. Everything else is ordered as
// shown, and every successfully completed block is opened and closed exactly
// once.
//
// Stream-state / index invariants (ABI):
//   - Non-tool content (text, thinking, provider) is exclusive: at most ONE
//     non-tool block is open at a time, and no tool block may be open
//     concurrently with it. A non-tool start requires no block open.
//   - MULTIPLE tool-call blocks may be open concurrently, each at its own
//     unique never-reused index. A tool start requires no non-tool block open
//     but may coexist with other open tool blocks.
//   - Indexes are unique across the entire streamed message and are never
//     reused after close.
//   - Every ToolCallDelta / ContentBlockStop index must name an open block of
//     the matching kind: tool deltas/stops bind their open tool block BY
//     INDEX; a non-tool stop names the single open non-tool block.
//     Open-missing or kind-mismatched indexes are invalid.
//   - TextDelta / ThinkingDelta / CurrentContentBlock signature_delta require
//     exactly the compatible open non-tool block; otherwise invalid.
//   - StreamError is a terminal abort: it may occur at any point, including
//     while content blocks are open. It implicitly abandons ALL open blocks
//     (tool and non-tool) and any buffered incomplete tool-call arguments —
//     this is not a successful ContentBlockStop and must not be represented as
//     one. It terminates the message/stream; neither MessageStop nor a
//     synthetic block stop is required. Any event after StreamError is
//     invalid.
//   - MessageStop / end-of-stream while ANY block remains open is invalid,
//     unless the open blocks were terminally aborted by StreamError (in which
//     case the stream already ended at the error — ordinary EOF after a
//     non-error open block is still invalid).
//   - Adapters must assign distinct indexes to parallel provider tool calls;
//     ToolCallBlockByIndex signature enforcement relies on this invariant.
message StreamEvent {
  // Outbound mutations compose topology + semantics (see package
  // outboundpolicy): required = topology (cardinality/order/boundaries/kind)
  // ∪ every semantic section changed/removed/added; any changed/removed/added
  // host-owned fact rejects. Host-owned means immutable, not unreturnable —
  // identical re-emit is a no-op. A one-for-one TextDelta rewrite needs only
  // ir.messages.write.assistant. The host's recursive field-diff verifier
  // enforces these rules transactionally across each plugin call.
  oneof event {
    string text_delta = 1;
    string thinking_delta = 2;
    ToolCallDelta tool_call_delta = 3;
    Usage usage = 4;
    StreamError error = 5;
    // Opaque provider signature. When emitted with open text/thinking content
    // it binds that block (CurrentContentBlock). When emitted alone after
    // closed blocks (Code Assist trailing thoughtSignature + empty text) it
    // is TrailingStandalone — preserve as SignatureDelta; do not synthesize
    // an empty content block. Not used for the tool-call signature path.
    string signature_delta = 6;
    MessageStart message_start = 7;
    MessageStop message_stop = 8;
    ContentBlockStart content_block_start = 9;
    ContentBlockStop content_block_stop = 10;
  }
}

// StreamEvents exists because a protobuf oneof cannot hold a repeated field.
message StreamEvents {
  repeated StreamEvent events = 1;
}

// ---------------------------------------------------------------------------
// Plugin-served HTTP
// ---------------------------------------------------------------------------

// Incoming HTTP request forwarded to a plugin's run_on_http_request hook.
// Built directly from net/http — does not cross the chat IR.
message HttpRequest {
  string method = 1;
  string path = 2;
  // Raw query string, without the leading "?".
  string query = 3;
  // "http" or "https".
  string scheme = 4;
  // Caller address, for a plugin that wants to refuse non-local requests
  // itself. The host has already applied its own guard before dispatching.
  string remote_addr = 5;
  // JSON-encoded map of request headers (map[string][]string). The host
  // forwards ONLY the safe operational headers (Accept, Content-Type,
  // User-Agent) unconditionally, plus the credential/identity headers
  // (Authorization, X-Api-Key, X-Torana-User, X-Torana-Team, X-Torana-Tenant)
  // when the exact executing plugin holds the approved env.request_headers
  // grant. All other headers — including Cookie, Proxy-Authorization,
  // arbitrary custom secrets, and X-Torana-Agent — are never forwarded.
  // Allowed multi-values are preserved under their canonical names. This is
  // enforced at the plugin dispatch boundary; a caller-supplied value here is
  // never authoritative.
  bytes headers_json = 6;
  bytes body = 7;
}

// Response produced by a plugin's run_on_http_request hook.
message HttpResponse {
  // HTTP status the host will write. Must be a final status in 200–599
  // (informational 1xx is not terminal under net/http). 204, 205, and 304 must
  // have an empty body; see HttpResponse.Validate.
  int32 status = 1;
  // JSON-encoded map of response headers (map[string][]string). The host
  // applies its own allowlist; anything outside it fails the response.
  bytes headers_json = 2;
  bytes body = 3;
}

// ---------------------------------------------------------------------------
// Background ticks
// ---------------------------------------------------------------------------

// Fired periodically by the host, with no request in flight.
//
// Every other hook is reactive: a plugin can only act while a request is
// passing through it. This one exists so a plugin can act when nothing is
// happening — refreshing a provider cache before it lapses, emitting a periodic
// report, expiring its own state.
//
// Requires env.background_tick. Running code with no request in flight is a
// capability an operator should grant deliberately: a plugin holding it can act
// — and spend — outside any request the operator can see.
//
// HookInput.request_id on a tick is a synthetic execution-scope id for
// plugin-private ephemeral metadata (env.meta_*), discarded when the tick
// ends — not a caller request. Caller content remains unavailable.
message TickRequest {
  // Monotonically increasing within one scheduler, starting at 1. Resets if the
  // scheduler restarts, so treat it as an ordering hint rather than a durable
  // counter.
  uint64 tick_id = 1;
  // Host wall-clock time. Plugins have no clock of their own: WASI preview1
  // exposes none, and this is the only time source they get.
  int64 unix_millis = 2;
  // Configured interval, so a plugin can reason about elapsed time without
  // assuming a particular cadence.
  int64 interval_ms = 3;
}

// What a plugin did during a tick. Reported for observability only; the host
// attaches no meaning to it beyond refusing a negative count.
message TickOutcome {
  // Non-negative count of countable actions the plugin took. Zero is allowed.
  int32 actions = 1;
  string note = 2;
}

// ---------------------------------------------------------------------------
// Hook envelopes
// ---------------------------------------------------------------------------

// Hook names a hook. It is NOT carried on the wire: the payload oneof is the
// sole discriminator, so a frame cannot claim one hook while carrying another's
// payload. This type exists for host and SDK code to name hooks in signatures
// and errors.
//
// An earlier draft put a hook field alongside the payload. That made
// contradictory frames — HOOK_BEFORE_REQUEST carrying a tick_request — perfectly
// valid protobuf, so "misdispatch is caught" depended on someone remembering to
// compare two fields. Deriving the hook from the payload makes the contradiction
// unrepresentable instead, which is the same lesson as dropping `handled`.
//
// The WASM boundary completes that story: guests export one run_hook, so there
// is no second discriminator at the export name either. request_id is not a
// WASM argument — it is only on HookInput — so the host cannot disagree with
// the envelope about which request a call belongs to.
//
// Guests also export supported_hooks() -> u32. Bit N is set when Hook value N
// is implemented:
//
//   bit 1 = HOOK_BEFORE_REQUEST
//   bit 2 = HOOK_AFTER_RESPONSE
//   bit 3 = HOOK_ON_STREAM_CHUNK
//   bit 4 = HOOK_ON_HTTP_REQUEST
//   bit 5 = HOOK_ON_TICK
//
// The bitmap must exactly equal the manifest's hook set. Bit 0 and every
// unassigned bit are invalid. A missing bit (declared, not registered) or an
// unexpected bit (registered, not declared) is a load-time error. Hook values
// that participate in this export are limited to 1..31 while the return type
// is u32; a wider set needs a wider export. An empty declaration / zero bitmap
// is also a load-time error — a module with no handlers is permanently dead,
// and that must not pass installation.
//
// The SDK derives the bitmap from actual registrations; the host compares it
// with the manifest before enabling the plugin. This is not a dispatch input —
// run_hook never consults it.
enum Hook {
  HOOK_UNSPECIFIED = 0;
  HOOK_BEFORE_REQUEST = 1;
  HOOK_AFTER_RESPONSE = 2;
  HOOK_ON_STREAM_CHUNK = 3;
  HOOK_ON_HTTP_REQUEST = 4;
  HOOK_ON_TICK = 5;
}

// AfterResponse is the payload for the after-response hook.
//
// mutable lives here, not on HookInput, because only this path can be
// observational. False when the response was streamed or was an upstream
// error: the bytes have already gone to the caller, or there is no body to
// rewrite, so a returned replacement is discarded. Every other hook is always
// mutable; placing it on the global envelope would let always-mutable hooks
// claim otherwise.
message AfterResponse {
  ChatResponse response = 1;
  bool mutable = 2;
}

// HookInput is what every hook receives. The payload determines which hook this
// is; there is no separate hook field to contradict it. The guest receives it
// via run_hook(ptr, size) -> u64 — one export, no request_id WASM argument.
message HookInput {
  // Minor version of the ABI contract the host is speaking. Additive changes
  // bump this; a plugin may use it to detect fields it can rely on.
  uint32 abi_minor = 1;
  // Host-assigned execution-scope id. This is the only place the id appears —
  // it is not also a WASM argument.
  //
  // For request-scoped hooks (before_request, after_response, stream, http)
  // this identifies the caller request, and all stream events for one response
  // share it. Availability of request-derived host calls is defined per
  // command and hook; the ID alone grants or guarantees nothing.
  //
  // For ticks — which fire with no request in flight — the host supplies a
  // unique synthetic scope id. Plugin-private ephemeral metadata (env.meta_*)
  // is available inside that scope and is discarded when the tick ends; that
  // is why the id must be unique and must not reuse a live request's. Caller
  // content and identity remain unavailable: there is no caller. Authors must
  // not interpret a tick's request_id as a caller request.
  uint64 request_id = 2;

  oneof payload {
    ChatRequest chat_request = 4;
    AfterResponse after_response = 5;
    StreamEvent stream_event = 6;
    HttpRequest http_request = 7;
    TickRequest tick_request = 8;
  }
}

// Suppress drops the input event and emits nothing. Stream hooks only.
//
// An empty message inside a oneof still marshals to a tag and a zero length, so
// this is distinguishable on the wire from a plugin that returned nothing —
// which is what makes it safe to express suppression as an action rather than
// as a flag.
message Suppress {}

// HookResult is what a hook returns when it wants something done.
//
// There is exactly ONE axis: the action. An earlier draft had two — a
// disposition enum beside a payload oneof — which made five illegal
// combinations representable: PASS carrying a payload, REPLACE carrying none,
// SUPPRESS carrying events, SUPPRESS on a non-stream hook, and an unspecified
// disposition. The validator caught them, but a shape that cannot express them
// needs no validator.
//
// Worse, the two-axis form claimed something it could not enforce. A frame with
// an unspecified disposition marshals to zero bytes, and zero bytes IS
// pass-through at the ABI level — a length, not a message — so the host never
// saw a frame to reject. The rule was unreachable.
//
// Pass-through therefore has exactly one encoding: return zero bytes. A
// HookResult with no action set marshals to zero bytes too, so the two are the
// same thing rather than two spellings of it.
//
// The action's type must match the hook that was dispatched. A result carrying
// another hook's action is a protocol error, and that one IS enforceable
// because such a frame is not empty.
message HookResult {
  oneof action {
    ChatRequest replace_request = 1;
    ChatResponse replace_response = 2;
    StreamEvents emit_events = 3;
    HttpResponse serve_http = 4;
    TickOutcome tick_outcome = 5;
    Suppress suppress = 6;
  }
}

// ---------------------------------------------------------------------------
// Host calls
// ---------------------------------------------------------------------------

// ErrorCode classifies a failed host call.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  // The capability was not granted. The plugin asked for something its manifest
  // may not even declare.
  ERROR_CODE_PERMISSION_DENIED = 1;
  // The key, conversation or record does not exist.
  ERROR_CODE_NOT_FOUND = 2;
  // The feature exists but the operator has not configured it — no durable
  // state store, no offload provider, no pricing table.
  ERROR_CODE_NOT_CONFIGURED = 3;
  // Configured but not usable right now: upstream down, budget exhausted.
  ERROR_CODE_UNAVAILABLE = 4;
  // The plugin's arguments did not parse or did not make sense.
  ERROR_CODE_INVALID_ARGUMENT = 5;
  // The host failed for a reason the plugin cannot act on.
  ERROR_CODE_INTERNAL = 6;
}

message HostError {
  ErrorCode code = 1;
  // Human-readable, for logs. Plugins should branch on `code`, never on this.
  string message = 2;
}

// HostCallResult is what every host call returns.
//
// A successful call with no value sets `value` to empty bytes, which remains
// distinguishable from the typed error arm.
//
// The oneof must be set. An empty HostCallResult (no arm) is refused — there is
// no pass-through meaning for a host-call reply the way there is for a hook
// result. See HostCallResult.Validate.
//
// This envelope is host-produced. Validate refuses unknown top-level fields
// (a future result arm). Multiple known arms on the wire follow protobuf's
// last-known-arm-wins rule after unmarshal; that is accepted here because the
// host, not a guest, authors the frame. Guest-controlled HookResult is stricter
// — see DecodeHookResult.
message HostCallResult {
  oneof result {
    bytes value = 1;
    HostError error = 2;
  }
}

// ---------------------------------------------------------------------------
// Host-call argument schemas (normative)
//
// Verdicts and MetaAppend move from JSON stuffed into ToranaMeta / opaque
// host_call strings onto these messages. The host unmarshals args as the
// message named by the command; Validate rejects frames that cannot be acted
// on. Permission names stay as today (env.block_request, …) except
// env.meta_append, which the dispatcher specially maps onto env.meta_set
// (no separate operator grant — see MetaAppendArgs).
// ---------------------------------------------------------------------------

// BlockRequestArgs is the argument body for env.block_request.
// Short-circuits the pipeline with a provider-shaped error.
message BlockRequestArgs {
  // HTTP-like rejection status the caller sees (e.g. 422). Must be in 400–599.
  int32 status = 1;
  // Stable machine code (e.g. "pii_detected"). Required.
  string code = 2;
  // Human message for the caller. Must not contain secrets.
  string message = 3;
}

// RespondRequestArgs is the argument body for env.respond_request.
// Serves content without calling upstream.
message RespondRequestArgs {
  // Assistant content to return. Empty is allowed (an empty completion).
  string content = 1;
}

// RouteRequestArgs is the argument body for env.route_request.
// An empty provider with a non-empty model is a model-only override on the
// original provider. At least one of provider or model must be set.
message RouteRequestArgs {
  string provider = 1;
  string model = 2;
}

// SetIdentityArgs is the argument body for env.set_identity.
// Overrides the rate-limit / identity key for this request.
message SetIdentityArgs {
  // Non-empty identity key. Empty is refused — clearing identity is not a
  // defined operation of this call.
  string identity = 1;
}

// Typed argument bodies for request-scoped metadata and cache commands.
//
// Every host call carries a typed proto message. The host validates these
// argument bodies and returns a classified HostError for malformed input.
//
//   env.meta_get / env.meta_set   permission: env.meta_get / env.meta_set
//   env.cache_get / env.cache_set permission: env.cache_get / env.cache_set
//   env.shared_cache_get / env.shared_cache_set
//                                  permission: matching command name
//
// Meta is request-scoped and private to the calling plugin. CacheGet/CacheSet
// are cross-request and private to the calling plugin. SharedCacheGet/
// SharedCacheSet deliberately expose one cross-plugin namespace for approved
// producer/consumer contracts. Both cache families reuse these argument bodies.

// Typed argument bodies for durable plugin state.
//
// State is per-plugin and survives restarts, unlike request-scoped metadata and
// the cache services. Absence follows the same contract as those:
//
//   key absent            -> HostCallResult.error{code: NOT_FOUND}
//   key present, value "" -> HostCallResult.value arm, empty bytes
//
// Deletion is an explicit command. Empty is an ordinary stored value, so
// env.state_delete—not a magic value passed to env.state_set—releases a key.
//
//   env.state_get     permission: env.state_get
//   env.state_set     permission: env.state_set
//   env.state_keys    permission: env.state_keys
//   env.state_delete  permission: env.state_set  (dispatcher special-case —
//                     do NOT derive it from the command string;
//                     "env.state_delete" is not an operator-facing capability,
//                     exactly as with env.meta_append)
//
// Deletion shares env.state_set because it mutates a namespace the plugin can
// already overwrite; a fourth durable-state capability would add manifest and
// approval ceremony without drawing a new security line.
//
// The host dispatcher and plugin linter both map env.state_delete to
// env.state_set; command spelling is not permission spelling for this call.

// StateGetArgs is the argument body for host command env.state_get.
message StateGetArgs {
  // Key within this plugin's durable namespace. Must be non-empty.
  string key = 1;
}

// StateSetArgs is the argument body for host command env.state_set.
message StateSetArgs {
  // Key within this plugin's durable namespace. Must be non-empty.
  string key = 1;
  // Value to store. Empty stores an empty value; it does NOT delete. Use
  // env.state_delete to release a key.
  string value = 2;
}

// StateDeleteArgs is the argument body for host command env.state_delete.
//
// Deleting a key that does not exist succeeds: the caller's intent is that the
// key is gone afterwards, and reporting NOT_FOUND would make every cleanup path
// branch on a condition it does not care about.
message StateDeleteArgs {
  // Key within this plugin's durable namespace. Must be non-empty.
  string key = 1;
}

// MetaGetArgs is the argument body for host command env.meta_get.
//
// Absence and emptiness are DIFFERENT results, and the host must keep them so:
//
//   - key absent            -> HostCallResult.error{code: NOT_FOUND}
//   - key present, value "" -> HostCallResult.value arm, empty bytes
//   - key present, value v  -> HostCallResult.value arm, v
//
// Collapsing them would make "nothing stored" indistinguishable from "I stored
// nothing", so absence and an empty stored string must remain separate.
//
message MetaGetArgs {
  // Key within this plugin's request-scoped namespace. Must be non-empty.
  string key = 1;
}

// MetaSetArgs is the argument body for host command env.meta_set.
message MetaSetArgs {
  // Key within this plugin's request-scoped namespace. Must be non-empty.
  string key = 1;
  // Value to store. Empty is a legitimate value, not a delete. After setting
  // "", a get must succeed with an empty value rather than reporting NOT_FOUND.
  string value = 2;
}

// CacheGetArgs is the argument body for host command env.cache_get.
//
// Same absence/emptiness contract as MetaGetArgs: a miss is
// error{code: NOT_FOUND}, and a stored empty string is a successful empty
// value arm.
message CacheGetArgs {
  // Cache key. Shared across plugins and requests, so callers should namespace
  // it themselves when they do not intend sharing. Must be non-empty.
  string key = 1;
}

// CacheSetArgs is the argument body for host command env.cache_set.
message CacheSetArgs {
  // Cache key. See CacheGetArgs. Must be non-empty.
  string key = 1;
  // Value to store. Empty is a legitimate value.
  string value = 2;
}

// MetaAppendArgs is the argument body for host command env.meta_append.
//
// Contract (normative; pinned by pb/v1 MetaAppend* constants and tests):
//
//   command:    env.meta_append
//   permission: env.meta_set  (dispatcher special-case — do NOT derive the
//               permission from the command string; "env.meta_append" is not
//               an operator-facing capability)
//   args:       MetaAppendArgs
//
// Success HostCallResult.value (constant-size ack vs read-back — do NOT return
// the cumulative buffer after every delta; that would be O(total×fragments)
// on the stream path):
//
//   - non-empty fragment → empty success value after atomic append
//   - empty fragment     → complete current buffer (absent → empty bytes)
//
// Host storage: under the request lock, append with amortized/in-place growth.
// Do not copy the full prefix on every fragment solely to populate the reply.
//
// Buffer / key effects (request-scoped, private to the calling plugin, keyed
// by block_index):
//
//   - absent key + empty fragment  → no-op/read; value empty; key stays absent
//   - present key + empty fragment → no-op/read; value is the existing buffer
//   - absent key + non-empty frag  → create; value empty (ack)
//   - present key + non-empty frag → append; value empty (ack)
//
// Empty fragment is the ContentBlockStop / fail-open read path so the guest
// can retrieve the assembled original without a racy meta_get / meta_set pair
// and without paying for a full buffer copy on every delta. See
// MetaAppendSuccessValue for the executable success-value contract.
message MetaAppendArgs {
  // Content-block index within the streamed message (ABI: unique, never
  // reused). Must be non-negative.
  int32 block_index = 1;
  // Fragment bytes to append. Empty is the no-op/read path (see message docs).
  bytes fragment = 2;
}

// CredentialGetArgs resolves one operator-bound credential slot declared by
// this plugin. The successful value arm contains the credential bytes exactly;
// values are never placed in configuration, logs, or diagnostic errors.
message CredentialGetArgs {
  string slot = 1;
}

// Plugin-private files use logical slash-separated paths. The host maps them
// into the executing plugin's private data directory; guests never receive or
// control an operating-system path.
message FileAppendArgs {
  string path = 1;
  bytes data = 2;
}

message FileReadArgs {
  string path = 1;
}

message FileWriteArgs {
  string path = 1;
  bytes data = 2;
}

message FileListArgs {
  // Empty lists the root of the declared private namespace.
  string prefix = 1;
}

message FileListResult {
  repeated string paths = 1;
}

message FileDeleteArgs {
  string path = 1;
}

message HTTPHeader {
  string name = 1;
  repeated string values = 2;
}

// OutboundHTTPRequestArgs addresses an operator-approved endpoint slot plus a
// relative path. A plugin cannot provide a scheme or authority at call time.
message OutboundHTTPRequestArgs {
  string endpoint = 1;
  string method = 2;
  string path = 3;
  repeated HTTPHeader headers = 4;
  bytes body = 5;
  // Zero selects the host's approved default. The host may clamp a smaller
  // positive value to the endpoint budget.
  uint32 timeout_ms = 6;
}

message OutboundHTTPResponse {
  int32 status = 1;
  repeated HTTPHeader headers = 2;
  bytes body = 3;
}

// ModelMessage is the provider-neutral prompt surface for a plugin-owned
// model call. Provider routing, model selection, credentials, and URL are not
// present: those belong to the operator binding for ModelCompleteArgs.service.
message ModelMessage {
  string role = 1;
  string content = 2;
}

// ModelCompleteArgs invokes one operator-bound model-service slot. It is a
// separate inference path, not a recursive trip through the user-facing
// plugin pipeline. The host applies the binding's provider, model, credential,
// timeout, and token budgets and may clamp the requested max_tokens.
message ModelCompleteArgs {
  string service = 1;
  repeated ModelMessage messages = 2;
  optional uint32 max_tokens = 3;
  optional double temperature = 4;
}

// ModelCompleteResult is the provider-neutral completion returned in the
// HostCallResult value arm. reported_model is empty when the provider does not
// identify the answering model; the host never guesses aliases.
message ModelCompleteResult {
  string content = 1;
  string reported_model = 2;
  string finish_reason = 3;
  Usage usage = 4;
}

// ModelPricingGetArgs resolves one operator-bound pricing resource. The slot
// may refer to the caller's routed model or to a separately bound model
// service, but the plugin cannot choose arbitrary provider/model coordinates.
message ModelPricingGetArgs {
  string resource = 1;
}

// ModelPricing contains USD rates per million tokens. Presence is meaningful:
// absent means unknown, while an explicitly present zero means free. Consumers
// must decline any decision that needs an absent rate rather than guessing.
message ModelPricing {
  optional double input_usd_per_mtok = 1;
  optional double output_usd_per_mtok = 2;
  optional double cache_read_usd_per_mtok = 3;
  optional double cache_write_usd_per_mtok = 4;
}
