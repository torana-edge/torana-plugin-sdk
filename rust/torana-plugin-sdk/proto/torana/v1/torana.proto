syntax = "proto3";

package torana.v1;
option go_package = "github.com/torana-edge/torana-plugin-sdk/pb";

message Message {
  string role = 1;
  string content = 2;
  bytes content_parts_json = 3;
  string thinking = 4;
  string thinking_signature = 5;
  string redacted_thinking = 9;
  repeated ToolCall tool_calls = 6;
  string tool_call_id = 7;
  string tool_name = 8;
  bytes cache_control_json = 10;
}

message ToolCall {
  string id = 1;
  string name = 2;
  bytes arguments_json = 3;
  string signature = 4;
}

message ToolDef {
  string name = 1;
  string description = 2;
  bytes parameters_json = 3;
  bool strict = 4;
  bytes cache_control_json = 5;
}

message ChatRequest {
  string model = 1;
  repeated Message messages = 2;
  repeated ToolDef tools = 3;
  bool stream = 4;
  optional int32 max_tokens = 5;
  optional double temperature = 6;
  optional double top_p = 7;
  repeated string stop_sequences = 8;
  bytes provider_extensions_json = 9;
  bytes torana_meta_json = 10;
  bytes safety_settings_json = 11;
}

message ToolCallStart {
  int32 index = 1;
  string id = 2;
  string name = 3;
  string signature = 4;
}

message ToolCallDelta {
  int32 index = 1;
  string arguments_delta = 2;
}

message ToolCallEnd {
  int32 index = 1;
}

message StreamError {
  int32 code = 1;
  string message = 2;
}

message StreamUsage {
  int32 input_tokens = 1;
  int32 output_tokens = 2;
  int32 cache_read_tokens = 3;
  int32 cache_write_tokens = 4;
}

message StreamEvent {
  oneof event {
    string text_delta = 1;
    string thinking_delta = 2;
    ToolCallStart tool_call_start = 3;
    ToolCallDelta tool_call_delta = 4;
    ToolCallEnd tool_call_end = 5;
    string finish_reason = 6;
    StreamUsage usage = 7;
    StreamError error = 8;
    string signature_delta = 9;
  }
}

message StreamEventResult {
  bool handled = 1;
  repeated StreamEvent events = 2;
}

message HttpRequest {
  string method = 1;
  string path = 2;
  bytes headers_json = 3;
  bytes body = 4;
}

message HttpResponse {
  int32 status = 1;
  bytes headers_json = 2;
  bytes body = 3;
  bool handled = 4;
}

message TickRequest {
  uint64 tick_id = 1;
  int64 unix_millis = 2;
  int64 interval_ms = 3;
}

message TickResult {
  bool handled = 1;
  int32 actions = 2;
  string note = 3;
}
